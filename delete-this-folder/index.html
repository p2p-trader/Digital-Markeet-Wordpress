<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordPress Theme</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    .notice-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 2.5rem;
      max-width: 540px;
      margin: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 1rem;
    }
    p {
      line-height: 1.6;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }
    .tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="notice-card">
    <span class="tag">Environment Placeholder</span>
    <h1>WordPress Theme Repository</h1>
    <p>This project is a WordPress theme &mdash; see the files in the root directory.</p>
    <p>This folder exists only to satisfy the build environment and can be safely deleted.</p>
  </div>
</body>
</html>
